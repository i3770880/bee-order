<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D98E04">
<title>明豐養蜂場 線上訂購</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --honey:#D98E04; --brown:#4A3410; --cream:#FFFBF2; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif; background: var(--cream); color: var(--brown); -webkit-tap-highlight-color: transparent; }
  .sec { scroll-margin-top: 64px; }
  .item.active { box-shadow: inset 0 0 0 2px var(--honey); background: #FFF8E6; }
  .btn-step { width: 36px; height: 36px; border-radius: 9999px; font-size: 20px; line-height: 1; font-weight: 700; display:flex; align-items:center; justify-content:center; user-select:none; }
  .btn-step:active { transform: scale(.92); }
  .chips::-webkit-scrollbar { display: none; }
  .chips { scrollbar-width: none; }
  input, textarea { font-size: 16px; } /* 避免 iOS 自動放大 */
  .pb-safe { padding-bottom: calc(env(safe-area-inset-bottom) + 12px); }
</style>
</head>
<body class="min-h-screen pb-32">

<!-- Header -->
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-amber-100">
  <div class="max-w-xl mx-auto px-4 pt-3 pb-2">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🍯</span>
      <h1 class="text-lg font-black tracking-wide">明豐養蜂場 <span class="text-amber-600">線上訂購</span></h1>
    </div>
    <nav id="chips" class="chips flex gap-2 overflow-x-auto mt-2 -mx-1 px-1 pb-1"></nav>
  </div>
</header>

<main class="max-w-xl mx-auto px-4 pt-4 space-y-5">

  <!-- Hero -->
  <section class="rounded-3xl p-5 text-white shadow-md" style="background:linear-gradient(135deg,#E9A912,#C77A00)">
    <p class="text-sm opacity-90">自然熟成・產地直送</p>
    <h2 class="text-2xl font-black mt-1">選好商品 → 填資料 → 產生 LINE 訂單</h2>
    <p class="text-sm mt-2 opacity-95">單筆滿 <b>$3,000</b> 寄同一地址免運費　｜　優惠活動恕不合併使用</p>
  </section>

  <div id="products" class="space-y-5"></div>

  <!-- Checkout -->
  <section id="checkout" class="sec bg-white rounded-3xl shadow-sm border border-amber-100 p-5 space-y-4">
    <h2 class="text-lg font-black">🧾 訂單確認</h2>

    <div id="summary" class="text-sm space-y-2"></div>

    <div class="border-t border-dashed border-amber-200 pt-3 space-y-1 text-sm">
      <div class="flex justify-between"><span>商品小計</span><span id="subTotal">$0</span></div>
      <div class="flex justify-between"><span>運費</span><span id="shipFee">$0</span></div>
      <div id="freeHint" class="text-xs text-amber-700"></div>
      <div class="flex justify-between text-lg font-black pt-1"><span>訂購總金額</span><span id="grandTotal" class="text-amber-700">$0</span></div>
    </div>

    <div>
      <p class="text-sm font-bold mb-2">取貨 / 寄送方式</p>
      <div class="grid grid-cols-2 gap-2" id="methods">
        <label class="cursor-pointer">
          <input type="radio" name="method" value="cvs" class="peer sr-only">
          <div class="peer-checked:border-amber-500 peer-checked:bg-amber-50 peer-disabled:opacity-40 border-2 border-gray-200 rounded-2xl p-3 text-center">
            <div class="font-bold text-sm">🏪 超商取貨</div>
            <div class="text-xs text-gray-500 mt-0.5">運費 +60 · 店到店</div>
          </div>
        </label>
        <label class="cursor-pointer">
          <input type="radio" name="method" value="home" class="peer sr-only" checked>
          <div class="peer-checked:border-amber-500 peer-checked:bg-amber-50 border-2 border-gray-200 rounded-2xl p-3 text-center">
            <div class="font-bold text-sm" id="homeLabel">🚚 宅配到府</div>
            <div class="text-xs text-gray-500 mt-0.5" id="homeSub">運費 +130 · 隔天送達</div>
          </div>
        </label>
      </div>
      <p id="methodNote" class="text-xs text-gray-500 mt-2 leading-relaxed"></p>
    </div>

    <div class="space-y-3">
      <div>
        <label class="text-sm font-bold" for="name">訂購人姓名 <span class="text-red-500">*</span></label>
        <input id="name" type="text" autocomplete="name" placeholder="例：王小明" class="mt-1 w-full rounded-xl border-2 border-gray-200 focus:border-amber-500 outline-none px-3 py-2.5">
      </div>
      <div>
        <label class="text-sm font-bold" for="phone">聯絡電話 <span class="text-red-500">*</span></label>
        <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0912345678" class="mt-1 w-full rounded-xl border-2 border-gray-200 focus:border-amber-500 outline-none px-3 py-2.5">
      </div>
      <div>
        <label class="text-sm font-bold" for="address" id="addrLabel">收件地址 <span class="text-red-500">*</span></label>
        <input id="address" type="text" autocomplete="street-address" placeholder="縣市 / 區 / 路名 / 門牌號碼" class="mt-1 w-full rounded-xl border-2 border-gray-200 focus:border-amber-500 outline-none px-3 py-2.5">
      </div>
      <div>
        <label class="text-sm font-bold" for="note">備註（選填）</label>
        <textarea id="note" rows="2" placeholder="例：希望週六到貨" class="mt-1 w-full rounded-xl border-2 border-gray-200 focus:border-amber-500 outline-none px-3 py-2.5"></textarea>
      </div>
    </div>

    <button id="btnGen" class="w-full rounded-2xl py-3.5 font-black text-white text-base shadow active:scale-[.98] transition" style="background:#D98E04">產生 LINE 訂購訊息</button>
    <button id="btnReset" class="w-full text-sm text-gray-500 py-1">清空購物車</button>
  </section>

  <!-- Output -->
  <section id="output" class="sec hidden bg-white rounded-3xl shadow-sm border border-green-200 p-5 space-y-3">
    <h2 class="text-lg font-black">💬 您的訂購訊息</h2>
    <textarea id="msg" rows="14" readonly class="w-full rounded-xl bg-gray-50 border border-gray-200 p-3 text-sm leading-relaxed"></textarea>
    <div class="grid grid-cols-2 gap-2">
      <button id="btnCopy" class="rounded-2xl py-3 font-bold border-2 border-amber-500 text-amber-700 active:scale-[.98]">📋 複製訊息</button>
      <button id="btnLine" class="rounded-2xl py-3 font-bold text-white active:scale-[.98]" style="background:#06C755">傳送到 LINE</button>
    </div>
    <p class="text-xs text-gray-500 leading-relaxed">按「傳送到 LINE」會開啟 LINE，請選擇明豐養蜂場好友後送出。若沒有自動開啟，可先複製訊息再貼到 LINE。</p>
  </section>

  <footer class="text-center text-xs text-gray-400 pb-4 space-y-1">
    <p>黑貓宅急便・蜂王乳全程冷凍宅配</p>
    <p>© 明豐養蜂場</p>
  </footer>
</main>

<!-- Bottom bar -->
<div id="bar" class="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-amber-200 shadow-[0_-4px_16px_rgba(0,0,0,.08)]">
  <div class="max-w-xl mx-auto px-4 pt-3 pb-safe flex items-center justify-between gap-3">
    <div>
      <div class="text-xs text-gray-500"><span id="barCount">0</span> 件商品</div>
      <div class="text-xl font-black text-amber-700" id="barTotal">$0</div>
    </div>
    <a href="#checkout" class="rounded-2xl px-6 py-3 font-black text-white" style="background:#D98E04">前往結帳</a>
  </div>
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-28 z-50 hidden bg-gray-900 text-white text-sm px-4 py-2 rounded-full shadow-lg max-w-[90%] text-center"></div>

<script>
/* ============ 設定 ============ */
// 若有 LINE 官方帳號，填入如 '@123abcde'，按鈕會直接開啟該帳號對話；留空則開啟好友選擇畫面
const LINE_OA_ID = '';
const FREE_SHIP_THRESHOLD = 3000;
const FEE_CVS = 60, FEE_HOME = 130;

/* ============ 商品資料 ============ */
const CATS = [
  { id:'wax', name:'蜂蠟', title:'食品級顆粒【蜂蠟】', icon:'🕯️', bg:'#FFF1CF', accent:'#B8860B',

    ],

      { id:'L3000', group:'3000 克桶裝', name:'龍眼蜜 3000 克／桶', desc:'免運｜買 2 桶贈 1 個、買 4 桶贈 2 個（贈品自選）', price:1600, free:true, gifts:true },

      { id:'C1', group:'組合套餐', name:'3000 克 1 桶 + 高山花粉 300 克 1 罐', price:2188, free:true },
      { id:'C2', name:'3000 克 1 桶 + 龍眼蜜 250 克 1 瓶', price:1788, free:true },
      { id:'C3', name:'3000 克 1 桶 + 龍眼蜜 400 克 1 瓶', price:1988, free:true },
      { id:'C4', name:'3000 克 1 桶 + 龍眼蜜 400 克 1 瓶 + 高山花粉 300 克 1 罐', price:2688, free:true },
      { id:'C5', name:'3000 克 1 桶 + 龍眼蜜 400 克 1 瓶 + 高山花粉 300 克 1 罐 + 蜂蜜喉糖 350 克 1 包', price:2888, free:true },

      { id:'L700_1', group:'700 克瓶裝', name:'龍眼蜜 700 克 × 1 瓶', price:788 },
      { id:'L700_2', name:'龍眼蜜 700 克 × 2 瓶', price:1400 },
      { id:'L700_3', name:'龍眼蜜 700 克 × 3 瓶', price:2040 },
      { id:'L700_4', name:'龍眼蜜 700 克 × 4 瓶', price:2600 },
      { id:'L700_6', name:'龍眼蜜 700 克 × 6 瓶', price:3780 }
    ]},
  { id:'candy', name:'蜂蜜喉糖', title:'季節限定商品【蜂蜜喉糖】', icon:'🍬', bg:'#E3EFDA', accent:'#4E8A2E',
    notes:[
      '一包 360 克（每包約 80 顆）。',
      '超商運費 +60 元；常溫宅配運費 +130 元；一次買三包寄同地址免運費。',
      '成份：麥芽糖、蜂蜜、枇杷葉濃縮粉、茯苓濃縮粉、桔梗濃縮粉、甘草濃縮粉、蜂膠粉、羅漢果粉、薄荷。不含防腐劑，請安心食用。',
      '此品項亦可與冷凍商品合併寄出。'
    ],
    items:[
      { id:'lozenge', name:'蜂蜜喉糖 360 克／包', desc:'一次買 3 包寄同地址免運', price:360, minFree:3 }
    ]},
  { id:'royal', name:'蜂王乳', title:'純手工採收【蜂王乳】', icon:'🥛', bg:'#FBD3FA', accent:'#A021A0', frozen:true,
    notes:[
      '黑貓宅急便全程冷凍宅配。',
      '含蜂王乳的訂單皆以冷凍宅配寄送。'
    ],
    items:[
      { id:'R350_1', group:'蜂王乳 350 克', name:'350 克 蜂王乳 × 1 瓶', desc:'含運', price:1260, free:true },
      { id:'R350_3', name:'350 克 蜂王乳 × 3 瓶', desc:'免運（寄同地址）', price:3300, free:true },
      { id:'R350_4', name:'350 克 蜂王乳 × 4 瓶', desc:'免運（寄同地址）｜送龍眼蜜 250 克 1 瓶（價值 288 元）', price:4400, free:true },

      { id:'R500_1', group:'蜂王乳 500 克', name:'500 克 蜂王乳 × 1 瓶', desc:'含運｜全程冷凍宅配到府', price:1700, free:true },
      { id:'R500_2', name:'500 克 蜂王乳 × 2 瓶', desc:'免運（寄同地址）', price:3100, free:true },
      { id:'R500_3', name:'500 克 蜂王乳 × 3 瓶', desc:'免運（寄同地址）｜送龍眼蜜 250 克 1 瓶（價值 288 元）', price:4650, free:true },

      { id:'S1', group:'組合套餐', name:'1 號餐', desc:'蜂王乳 350 克 ×2、龍眼蜜 400 克 ×2｜免運', price:2950, free:true },
      { id:'S2', name:'2 號餐', desc:'蜂王乳 500 克 ×2、龍眼蜜 400 克 ×2｜免運', price:3850, free:true },
      { id:'S3', name:'3 號餐', desc:'蜂王乳 350 克 ×1、蜂王乳 500 克 ×1、龍眼蜜 400 克 ×2｜免運', price:3400, free:true },
      { id:'S5', name:'5 號餐', desc:'蜂王乳 350 克 ×3、龍眼蜜 400 克 ×2｜免運', price:4000, free:true },
      { id:'S6', name:'6 號餐 新手嚐鮮組', desc:'蜂王乳 350 克 ×1、龍眼蜜 400 克 ×1｜含運', price:1650, free:true },
      { id:'S7', name:'7 號餐 新手進階組', desc:'蜂王乳 500 克 ×1、龍眼蜜 400 克 ×1｜含運', price:2099, free:true },
      { id:'S8', name:'8 號餐 蜂蜜三寶', desc:'蜂王乳 350 克 ×2、龍眼蜜 400 克 ×2、高山花粉 300 克 ×1｜含運', price:3499, free:true },
      { id:'S9', name:'9 號餐 蜂蜜三寶', desc:'蜂王乳 500 克 ×2、龍眼蜜 400 克 ×2、高山花粉 300 克 ×2｜含運', price:4899, free:true }
    ]},
  { id:'pollen', name:'高山蜂花粉', title:'杉林溪高海拔【高山蜂花粉】', icon:'🌼', bg:'#D3E5F5', accent:'#2B6CA3',
    notes:[
      '大包保存期限到 2029 年 2 月（全程冷凍可放三年）。',
      '此品項亦可與冷凍商品合併寄出。'
    ],
    items:[
      { id:'P300', name:'高山蜂花粉 300 克／罐', price:648 },
      { id:'P1000', name:'花粉 1000 克 補充包／包', price:1500 },
      { id:'P1000x2', name:'花粉補充包 1000 克 × 2 袋', desc:'常溫宅配免運｜送高山花粉 300 克 1 罐', price:3000, free:true }
    ]}
];

const GIFT_OPTS = [
  { id:'g_longan', name:'龍眼蜜 400 克 1 瓶' },
  { id:'g_pollen', name:'高山花粉 300 克 1 罐' },
  { id:'g_candy',  name:'蜂蜜喉糖 350 克 1 包' }
];

const ITEMS = {}; CATS.forEach(c => c.items.forEach(i => { i.cat = c.id; ITEMS[i.id] = i; }));

/* ============ 狀態 ============ */
const qty = {};
const gift = { g_longan:0, g_pollen:0, g_candy:0 };
const $ = s => document.querySelector(s);
const money = n => '$' + n.toLocaleString('en-US');

/* ============ 畫面 ============ */
function renderProducts() {
  $('#chips').innerHTML = CATS.map(c =>
    `<a href="#cat-${c.id}" class="shrink-0 rounded-full px-3 py-1.5 text-sm font-bold border" style="background:${c.bg};border-color:${c.accent}33;color:${c.accent}">${c.icon} ${c.name}</a>`
  ).join('');

  $('#products').innerHTML = CATS.map(c => {
    let lastGroup = null;
    const rows = c.items.map(i => {
      let head = '';
      if (i.group && i.group !== lastGroup) {
        head = `<div class="pt-3 pb-1 text-xs font-bold tracking-wide" style="color:${c.accent}">▍${i.group}</div>`;
        lastGroup = i.group;
      }
      const badge = i.free ? `<span class="ml-1 align-middle text-[10px] font-bold px-1.5 py-0.5 rounded bg-green-100 text-green-700">免運</span>` : '';
      return head + `
      <div class="item rounded-2xl border border-black/5 bg-white p-3 flex items-center gap-3" id="row-${i.id}">
        <div class="flex-1 min-w-0">
          <div class="text-[15px] font-bold leading-snug">${i.name}${badge}</div>
          ${i.desc ? `<div class="text-xs text-gray-500 mt-0.5 leading-relaxed">${i.desc}</div>` : ''}
          <div class="mt-1 font-black" style="color:${c.accent}">${money(i.price)}</div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button class="btn-step bg-gray-100 text-gray-600" data-act="dec" data-id="${i.id}" aria-label="減少">−</button>
          <span class="w-5 text-center font-black" id="q-${i.id}">0</span>
          <button class="btn-step text-white" style="background:${c.accent}" data-act="inc" data-id="${i.id}" aria-label="增加">+</button>
        </div>
      </div>
      ${i.gifts ? giftBox() : ''}`;
    }).join('');

    return `
    <section id="cat-${c.id}" class="sec rounded-3xl p-4 shadow-sm" style="background:${c.bg}">
      <h2 class="text-lg font-black mb-2" style="color:${c.accent}">${c.icon} ${c.title}</h2>
      <ul class="text-xs leading-relaxed text-gray-700 space-y-1 mb-3">
        ${c.notes.map(n => `<li class="flex gap-1.5"><span>•</span><span>${n}</span></li>`).join('')}
      </ul>
      <div class="space-y-2">${rows}</div>
    </section>`;
  }).join('');
}

function giftBox() {
  return `
  <div id="giftBox" class="hidden rounded-2xl bg-white/80 border-2 border-dashed border-amber-400 p-3 mt-1">
    <div class="text-sm font-bold">🎁 請選擇贈品：<span id="giftLeft" class="text-amber-700"></span></div>
    <div class="mt-2 space-y-2">
      ${GIFT_OPTS.map(g => `
      <div class="flex items-center justify-between">
        <span class="text-sm">${g.name}</span>
        <div class="flex items-center gap-2">
          <button class="btn-step bg-gray-100 text-gray-600" data-act="gdec" data-id="${g.id}">−</button>
          <span class="w-5 text-center font-black" id="q-${g.id}">0</span>
          <button class="btn-step bg-amber-500 text-white" data-act="ginc" data-id="${g.id}">+</button>
        </div>
      </div>`).join('')}
    </div>
  </div>`;
}

/* ============ 計算 ============ */
function giftAllowed() { return Math.floor((qty.L3000 || 0) / 2); }
function giftUsed() { return Object.values(gift).reduce((a, b) => a + b, 0); }

function lines() {
  return Object.keys(qty).filter(id => qty[id] > 0).map(id => ({ item: ITEMS[id], n: qty[id], sum: ITEMS[id].price * qty[id] }));
}

function calc() {
  const ls = lines();
  const sub = ls.reduce((a, l) => a + l.sum, 0);
  const count = ls.reduce((a, l) => a + l.n, 0);
  const hasFrozen = ls.some(l => ITEMS[l.item.id].cat === 'royal');
  const hasFreeItem = ls.some(l => l.item.free || (l.item.minFree && l.n >= l.item.minFree));
  const free = sub >= FREE_SHIP_THRESHOLD || hasFreeItem || hasFrozen;
  const method = hasFrozen ? 'home' : document.querySelector('input[name=method]:checked').value;
  const fee = (sub === 0 || free) ? 0 : (method === 'cvs' ? FEE_CVS : FEE_HOME);
  return { ls, sub, count, hasFrozen, free, method, fee, total: sub + fee };
}

function update() {
  // 贈品上限
  const allowed = giftAllowed();
  while (giftUsed() > allowed) {
    const k = GIFT_OPTS.map(g => g.id).reverse().find(id => gift[id] > 0);
    gift[k]--;
  }
  const box = $('#giftBox');
  if (box) {
    box.classList.toggle('hidden', allowed === 0);
    $('#giftLeft').textContent = `可選 ${allowed} 個，已選 ${giftUsed()} 個`;
  }
  GIFT_OPTS.forEach(g => { const el = $('#q-' + g.id); if (el) el.textContent = gift[g.id]; });

  // 數量與高亮
  Object.keys(ITEMS).forEach(id => {
    const n = qty[id] || 0;
    $('#q-' + id).textContent = n;
    $('#row-' + id).classList.toggle('active', n > 0);
  });

  const r = calc();

  // 運送方式
  const cvsInput = document.querySelector('input[name=method][value=cvs]');
  const homeInput = document.querySelector('input[name=method][value=home]');
  cvsInput.disabled = r.hasFrozen;
  if (r.hasFrozen) homeInput.checked = true;
  $('#homeLabel').textContent = r.hasFrozen ? '❄️ 冷凍宅配' : '🚚 宅配到府';
  $('#homeSub').textContent = r.hasFrozen ? '黑貓宅急便・全程冷凍' : '運費 +130 · 隔天送達';
  $('#methodNote').textContent = r.hasFrozen
    ? '訂單含蜂王乳，將以黑貓冷凍宅配寄出（3000 克／700 克龍眼蜜不可寄冷凍，將由店家與您確認寄送方式）。'
    : '超商為店到店純取貨，約 3-4 天到店，收到產品再轉帳；宅配寄出後隔天送達。';
  $('#addrLabel').innerHTML = (r.method === 'cvs' ? '取貨超商（店名／店號）' : '收件地址') + ' <span class="text-red-500">*</span>';
  $('#address').placeholder = r.method === 'cvs' ? '例：7-11 ○○門市（店號 123456）' : '縣市 / 區 / 路名 / 門牌號碼';

  // 摘要
  $('#summary').innerHTML = r.ls.length
    ? r.ls.map(l => `<div class="flex justify-between gap-3"><span class="min-w-0">${l.item.name} <span class="text-gray-400">× ${l.n}</span></span><span class="font-bold shrink-0">${money(l.sum)}</span></div>`).join('')
      + (allowed ? `<div class="text-amber-700">🎁 贈品：${giftText() || '（尚未選擇）'}</div>` : '')
    : '<div class="text-gray-400 text-center py-3">尚未選擇商品，請從上方挑選 🍯</div>';

  $('#subTotal').textContent = money(r.sub);
  $('#shipFee').textContent = r.sub === 0 ? '$0' : (r.fee === 0 ? '免運 $0' : money(r.fee));
  $('#grandTotal').textContent = money(r.total);
  $('#barTotal').textContent = money(r.total);
  $('#barCount').textContent = r.count;

  const hint = $('#freeHint');
  if (r.sub > 0 && !r.free) {
    hint.textContent = `再買 ${money(FREE_SHIP_THRESHOLD - r.sub)} 即可免運費（單筆滿 ${money(FREE_SHIP_THRESHOLD)} 寄同地址）`;
  } else if (r.sub > 0) {
    hint.textContent = '✅ 已符合免運條件';
  } else hint.textContent = '';
}

function giftText() {
  return GIFT_OPTS.filter(g => gift[g.id] > 0).map(g => `${g.name} × ${gift[g.id]}`).join('、');
}

/* ============ 互動 ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.dataset.id, act = b.dataset.act;
  if (act === 'inc') qty[id] = (qty[id] || 0) + 1;
  else if (act === 'dec') qty[id] = Math.max(0, (qty[id] || 0) - 1);
  else if (act === 'ginc') { if (giftUsed() < giftAllowed()) gift[id]++; else toast('贈品數量已達上限'); }
  else if (act === 'gdec') gift[id] = Math.max(0, gift[id] - 1);
  update();
});
document.querySelectorAll('input[name=method]').forEach(r => r.addEventListener('change', update));

function toast(t) {
  const el = $('#toast'); el.textContent = t; el.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 2200);
}

/* 記住訂購人資料 */
const FIELDS = ['name', 'phone', 'address', 'note'];
try { FIELDS.forEach(f => { const v = localStorage.getItem('mf_' + f); if (v) $('#' + f).value = v; }); } catch (e) {}
FIELDS.forEach(f => $('#' + f).addEventListener('input', () => { try { localStorage.setItem('mf_' + f, $('#' + f).value); } catch (e) {} }));

/* 產生訊息 */
function buildMessage(r) {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const t = `${now.getFullYear()}/${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const methodTxt = r.hasFrozen ? '黑貓冷凍宅配' : (r.method === 'cvs' ? '超商取貨（店到店）' : '常溫宅配');
  const out = [];
  out.push('【明豐養蜂場 訂購單】');
  out.push(t);
  out.push('');
  out.push('👤 訂購人：' + $('#name').value.trim());
  out.push('📞 電話：' + $('#phone').value.trim());
  out.push('🚚 寄送方式：' + methodTxt);
  out.push((r.method === 'cvs' ? '🏪 取貨門市：' : '📍 地址：') + $('#address').value.trim());
  out.push('');
  out.push('🛒 訂購品項');
  r.ls.forEach(l => out.push(`• ${l.item.name} × ${l.n} = ${money(l.sum)}`));
  const g = giftText();
  if (g) out.push('🎁 贈品：' + g);
  out.push('');
  out.push('商品小計：' + money(r.sub));
  out.push('運費：' + (r.fee === 0 ? '免運' : money(r.fee)));
  out.push('💰 訂購總金額：' + money(r.total));
  const note = $('#note').value.trim();
  if (note) { out.push(''); out.push('📝 備註：' + note); }
  out.push('');
  out.push('請協助確認訂單與匯款資訊，謝謝！🍯');
  return out.join('\n');
}

$('#btnGen').addEventListener('click', () => {
  const r = calc();
  if (r.ls.length === 0) return toast('請先選擇商品');
  if (!$('#name').value.trim()) { $('#name').focus(); return toast('請輸入訂購人姓名'); }
  const ph = $('#phone').value.replace(/[\s-]/g, '');
  if (!/^(09\d{8}|0\d{1,2}\d{6,8})$/.test(ph)) { $('#phone').focus(); return toast('請輸入正確的聯絡電話'); }
  if (!$('#address').value.trim()) { $('#address').focus(); return toast(r.method === 'cvs' ? '請輸入取貨超商' : '請輸入收件地址'); }
  if (giftAllowed() > giftUsed()) { $('#giftBox').scrollIntoView({ behavior:'smooth', block:'center' }); return toast('還有贈品尚未選擇喔'); }

  $('#msg').value = buildMessage(r);
  $('#output').classList.remove('hidden');
  $('#output').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

$('#btnCopy').addEventListener('click', async () => {
  const text = $('#msg').value;
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const m = $('#msg'); m.removeAttribute('readonly'); m.select(); document.execCommand('copy'); m.setAttribute('readonly', ''); }
  toast('已複製訂購訊息 ✅');
});

$('#btnLine').addEventListener('click', () => {
  const text = encodeURIComponent($('#msg').value);
  const url = LINE_OA_ID
    ? `https://line.me/R/oaMessage/${encodeURIComponent(LINE_OA_ID)}/?${text}`
    : `https://line.me/R/msg/text/?${text}`;
  window.open(url, '_blank');
});

$('#btnReset').addEventListener('click', () => {
  if (!confirm('確定要清空購物車嗎？')) return;
  Object.keys(qty).forEach(k => delete qty[k]);
  Object.keys(gift).forEach(k => gift[k] = 0);
  $('#output').classList.add('hidden');
  update();
});

renderProducts();
update();
</script>
</body>
</html>
